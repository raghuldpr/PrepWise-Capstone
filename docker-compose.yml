services:
  # PostgreSQL Database Service (Supabase PostgreSQL Compatible)
  db:
    image: postgres:16-alpine
    container_name: prepwise-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-prepwise_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${HOST_DB_PORT:-5432}:5432"
    volumes:
      - prepwise_pg_data:/var/lib/postgresql/data
      - ./supabase/migrations/20260904180000_create_prepwise_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prepwise-network

  # Spring Boot Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prepwise-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/prepwise_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-https://api.groq.com/openai/v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
      FILE_STORAGE_PATH: /var/app/uploads
    ports:
      - "8080:8080"
    volumes:
      - prepwise_uploads_data:/var/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prepwise-network

  # React / Nginx Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: prepwise-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - prepwise-network

networks:
  prepwise-network:
    driver: bridge

volumes:
  prepwise_pg_data:
    driver: local
  prepwise_uploads_data:
    driver: local
