services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: prepwise-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-prepwise_db}
      MYSQL_USER: ${DB_USERNAME:-prepwise_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-prepwise_password}
    ports:
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - prepwise_db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - prepwise-network

  # Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prepwise-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-prepwise_db}
      DB_USERNAME: ${DB_USERNAME:-prepwise_user}
      DB_PASSWORD: ${DB_PASSWORD:-prepwise_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
      FILE_STORAGE_PATH: /var/app/uploads
    ports:
      - "8080:8080"
    volumes:
      - prepwise_uploads_data:/var/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prepwise-network

  # React / Nginx Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: prepwise-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - prepwise-network

networks:
  prepwise-network:
    driver: bridge

volumes:
  prepwise_db_data:
    driver: local
  prepwise_uploads_data:
    driver: local
