# Render Blueprint Specification for PrepWise Full-Stack Deployment
# Documentation: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Backend API Web Service (Spring Boot 3 + Java 17)
  # -------------------------------------------------------------
  - type: web
    name: prepwise-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8080"
      # Aiven MySQL full JDBC URL (includes SSL)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: CORS_ALLOWED_ORIGINS
        value: https://prepwise-frontend.onrender.com,https://prepwise.onrender.com
      - key: FILE_STORAGE_TYPE
        value: local
      - key: FILE_STORAGE_PATH
        value: /var/app/uploads
    disk:
      name: prepwise-uploads
      mountPath: /var/app/uploads
      sizeGB: 1

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React 19 + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: prepwise-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://prepwise-backend.onrender.com/api
