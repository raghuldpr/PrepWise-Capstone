# Render Blueprint Specification for PrepWise Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # PrepWise Backend API Web Service (Spring Boot 3 + Java 17 Docker)
  # -------------------------------------------------------------
  - type: web
    name: prepwise-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8080"
      # Supabase PostgreSQL Direct JDBC Connection
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Spring Security JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      # Groq Cloud AI API (Qwen Model)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: AI_SERVICE_URL
        value: https://api.groq.com/openai/v1
      # CORS: Set to your Vercel frontend URL (comma-separated if multiple)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # File storage configuration for resumes
      - key: FILE_STORAGE_TYPE
        value: local
      - key: FILE_STORAGE_PATH
        value: /var/app/uploads
