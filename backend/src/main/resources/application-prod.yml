server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: ${FILE_STORAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${FILE_STORAGE_MAX_REQUEST_SIZE:10MB}
  application:
    name: prepwise-backend
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

ai:
  api-key: ${AI_GEMINI_API_KEY:${GEMINI_API_KEY:}}
  model: ${AI_MODEL:gemini-2.5-flash}
  api-base-url: ${AI_SERVICE_URL:https://generativelanguage.googleapis.com}

file-storage:
  type: ${FILE_STORAGE_TYPE:local}
  path: ${FILE_STORAGE_PATH:/var/app/uploads}
  max-size-bytes: ${FILE_STORAGE_MAX_SIZE:10485760}
  s3:
    bucket: ${FILE_STORAGE_S3_BUCKET:}
    region: ${FILE_STORAGE_S3_REGION:us-east-1}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
