server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-stacktrace: never
    include-message: never

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: ${FILE_STORAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${FILE_STORAGE_MAX_REQUEST_SIZE:10MB}
  application:
    name: prepwise-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}${DB_SSLMODE:?sslmode=require}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres.vmcswtsywmbkvykepwpv}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

ai:
  provider: ${AI_PROVIDER:groq}
  api-key: ${GROQ_API_KEY:${AI_API_KEY:}}
  model: ${GROQ_MODEL:${AI_MODEL:qwen/qwen3.6-27b}}
  fallback-model: ${AI_FALLBACK_MODEL:qwen/qwen3.8-27b}
  max-tokens: ${AI_MAX_TOKENS:1000}
  api-base-url: ${AI_SERVICE_URL:${AI_API_BASE_URL:https://api.groq.com/openai/v1}}

file-storage:
  type: ${FILE_STORAGE_TYPE:local}
  path: ${FILE_STORAGE_PATH:/var/app/uploads}
  max-size-bytes: ${FILE_STORAGE_MAX_SIZE:10485760}
  s3:
    bucket: ${FILE_STORAGE_S3_BUCKET:}
    region: ${FILE_STORAGE_S3_REGION:us-east-1}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
