server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  application:
    name: prepwise-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}${DB_SSLMODE:?sslmode=require}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres.vmcswtsywmbkvykepwpv}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

ai:
  provider: ${AI_PROVIDER:groq}
  api-key: ${GROQ_API_KEY:${AI_API_KEY:}}
  model: ${GROQ_MODEL:${AI_MODEL:qwen/qwen3.6-27b}}
  fallback-model: ${AI_FALLBACK_MODEL:qwen/qwen3.8-27b}
  max-tokens: ${AI_MAX_TOKENS:1000}
  api-base-url: ${AI_SERVICE_URL:${AI_API_BASE_URL:https://api.groq.com/openai/v1}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

resume:
  upload:
    max-size-bytes: ${RESUME_MAX_SIZE_BYTES:10485760}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
