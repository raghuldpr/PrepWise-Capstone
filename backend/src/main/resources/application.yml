server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  application:
    name: prepwise-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:prepwise_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

ai:
  provider: ${AI_PROVIDER:groq}
  api-key: ${GROQ_API_KEY:${AI_API_KEY:}}
  model: ${GROQ_MODEL:${AI_MODEL:qwen/qwen3.8-27b}}
  fallback-model: ${AI_FALLBACK_MODEL:qwen/qwen3.8-27b}
  api-base-url: ${AI_SERVICE_URL:https://api.groq.com/openai/v1}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

resume:
  upload:
    max-size-bytes: ${RESUME_MAX_SIZE_BYTES:10485760}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
